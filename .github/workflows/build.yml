name: Build and Push to Artifact Registry

on:
  push:
    branches:
      - '*'

env:
  REGISTRY: us-west1-docker.pkg.dev
  IMAGE_PATH: us-west1-docker.pkg.dev/eqtgke/eqt/collab
  CACHE_TAG: buildcache

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # Use specific buildkit version to avoid Docker Hub issues
          driver-opts: |
            image=moby/buildkit:v0.12.5
        continue-on-error: true

      # Wait and retry if first attempt failed (Docker Hub transient errors)
      - name: Wait before retry
        if: failure()
        run: sleep 10

      - name: Retry Docker Buildx setup
        if: failure()
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: |
            image=moby/buildkit:v0.12.5

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.EQTGKE_JSON }}

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker us-west1-docker.pkg.dev --quiet

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_PATH }}:${{ github.sha }}
            ${{ env.IMAGE_PATH }}:latest
          cache-from: type=registry,ref=${{ env.IMAGE_PATH }}:${{ env.CACHE_TAG }}
          cache-to: type=registry,ref=${{ env.IMAGE_PATH }}:${{ env.CACHE_TAG }},mode=max

