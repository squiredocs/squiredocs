name: Test

on:
  push:
    branches:
      - '*'

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: collab_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      # Jest's Babel transform cache. Additive to the npm cache above: that one
      # caches package tarballs, this one caches transform output. A stale or
      # missing entry can only cost time, never change a result — Jest
      # re-transforms whenever content does not match.
      - name: Cache Jest transform output
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-cache-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            jest-cache-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci

      - name: Run server tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/collab_test_db
          REDIS_HOST: localhost
          REDIS_PORT: 6379
          # Explicit worker count, sized to the runner (ubuntu-latest reports 4
          # via os.availableParallelism()). CI pins a number rather than the
          # local 50% so the value is visible and reviewable here.
          JEST_MAX_WORKERS: 4
        run: npm run test:server

  client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install client dependencies
        run: cd client && npm ci

      - name: Run client tests
        run: npm run test:client

      - name: Run first-run rehearsal suite (deterministic — bundle drift, content budgets, grader regressions)
        run: npm run test:first-run

      # Feature 060: the Docker-free self-host distribution suite (install.sh
      # with a stubbed PATH, compose and settings files, release.mjs, AGENTS.md,
      # release.yml structure). The served-route byte pins run in test:server.
      - name: Run self-host distribution suite
        run: npm run test:self-host

      - name: Shellcheck the install script and the squire wrapper
        run: shellcheck -s sh distribution/self-host/install.sh distribution/self-host/squire
