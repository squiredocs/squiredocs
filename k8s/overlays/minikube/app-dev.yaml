# app-dev-mutagen.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-dev
  namespace: collab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app-dev
  template:
    metadata:
      labels:
        app: app-dev
    spec:
      initContainers:
      - name: init-local-dev
        image: busybox:1.35
        command: ['sh', '-c', 'mkdir -p /local-dev && chmod 755 /local-dev']
        volumeMounts:
        - name: local-dev-volume
          mountPath: /local-dev
      containers:
      - name: app
        image: collab:latest
        imagePullPolicy: IfNotPresent
        securityContext:
          runAsUser: 0
        command: ["sleep", "infinity"]
        workingDir: /local-dev
        ports:
        - containerPort: 3001
        - containerPort: 5173
        volumeMounts:
        - name: local-dev-volume
          mountPath: /local-dev
        env:
        - name: PORT
          value: "3001"
        - name: NODE_ENV
          value: development
        # Feature 059 (RBD-059-1): development signs in like the hosted service
        # (team mode: Google, plus the dev faucet). Set SQUIRE_MODE=local in a
        # shell to exercise local mode.
        - name: SQUIRE_MODE
          value: team
        # Feature 058 (RBD-058-28): development mirrors the hosted service
        # (marketing pages, analytics shell, credits, admin emails). Unset it,
        # or set "false", in a shell to exercise self-host mode.
        - name: SQUIRE_HOSTED
          value: "true"
        # Positive opt-in that mounts the dev-only auth-bypass routes
        # (/auth/dev-login, /auth/dev-onboarding-reset). Fail-closed: the routes
        # are OFF unless this is explicitly "1". Present ONLY in this dev overlay
        # — never in aws-prod — so the endpoints can never leak into production
        # even if NODE_ENV is somehow left unset again.
        - name: ENABLE_DEV_ENDPOINTS
          value: "1"
        - name: DB_HOST
          value: collab-postgres
        - name: DB_PORT
          value: "5432"
        - name: DB_NAME
          value: collab_db
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: username
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: password
        # Redis
        - name: REDIS_HOST
          value: collab-redis
        - name: REDIS_PORT
          value: "6379"
        # Email Notifications (AWS SES SMTP)
        - name: SES_SMTP_USER
          valueFrom:
            secretKeyRef:
              name: ses-secret
              key: SES_SMTP_USER
        - name: SES_SMTP_PASS
          valueFrom:
            secretKeyRef:
              name: ses-secret
              key: SES_SMTP_PASS
        - name: SES_FROM_EMAIL
          valueFrom:
            secretKeyRef:
              name: ses-secret
              key: SES_FROM_EMAIL
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: ses-secret
              key: ADMIN_EMAIL
        # S3-backed document image storage (optional: image uploads are disabled
        # if this secret is absent — see server/s3-images.js). Point S3_IMAGE_BUCKET
        # at a separate dev bucket.
        - name: S3_IMAGE_BUCKET
          valueFrom:
            secretKeyRef:
              name: s3-images-secret
              key: S3_IMAGE_BUCKET
              optional: true
        - name: S3_IMAGE_REGION
          valueFrom:
            secretKeyRef:
              name: s3-images-secret
              key: S3_IMAGE_REGION
              optional: true
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: s3-images-secret
              key: AWS_ACCESS_KEY_ID
              optional: true
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: s3-images-secret
              key: AWS_SECRET_ACCESS_KEY
              optional: true
        # Add resource limits for better performance
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
      volumes:
      - name: local-dev-volume
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: app-dev-service
  namespace: collab
spec:
  selector:
    app: app-dev
  ports:
  - name: express
    port: 3001
    targetPort: 3001
    nodePort: 30001
  - name: vite
    port: 5173
    targetPort: 5173
    nodePort: 30173
  type: NodePort
  # Session affinity helps maintain WebSocket connections to the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800


