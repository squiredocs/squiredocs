# Feature 058: the minikube base collab-app mirrors production's hosted-mode
# and migration settings (the hosted service's production overlay).
# The db-migrate Job keeps owning migrations. STORAGE_DRIVER is left to
# auto-detect (s3 when S3_IMAGE_BUCKET is set, else local) and APP_URL to
# default from CLIENT_URL.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-app
  namespace: collab
spec:
  template:
    spec:
      containers:
        - name: collab-app
          env:
            - name: SQUIRE_HOSTED
              value: "true"
            - name: MIGRATE_ON_BOOT
              value: "false"
