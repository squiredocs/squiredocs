apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Minikube dev overlay — behaviorally identical to today's effective manifests
# (FR-009, SC-003): premium-rwo/standard-rwo storage classes, app-dev tooling
# pod, /health for both probes, passwordless Redis, image collab:latest, PSS
# warn=baseline only. No hardening patches (those live in aws-prod).
#
# Feature 058: the base collab-app pod now runs NODE_ENV=production from the
# image's ENV (RBD-058-15), so its secrets (k8s/auth.env, the MCP secret) must
# be strong non-default values or it refuses to boot. The self-host-config
# patch mirrors production's SQUIRE_HOSTED=true and MIGRATE_ON_BOOT=false (the
# migrate Job keeps running); STORAGE_DRIVER is left to auto-detect.

namespace: collab

resources:
  - ../../base
  - storageclasses/premium-rwo.yaml
  - storageclasses/standard-rwo.yaml
  - app-dev.yaml

# App + migrate image → collab:latest (matches legacy deploy.sh minikube path).
images:
  - name: collab-app
    newName: collab
    newTag: latest

patches:
  # Feature 058: SQUIRE_HOSTED=true, MIGRATE_ON_BOOT=false on collab-app.
  - path: patches/app-self-host-config.yaml
  # PSS warn=baseline only (no enforce, RD-8).
  - path: patches/namespace-pss.yaml
    target:
      kind: Namespace
      name: collab
  # Dev never ran the nightly backup CronJob (it needs the backup image +
  # backup-s3cmd secret, absent in dev). Drop it so the minikube render stays
  # behaviorally identical to today.
  - patch: |
      $patch: delete
      apiVersion: batch/v1
      kind: CronJob
      metadata:
        name: postgres-backup
        namespace: collab
    target:
      kind: CronJob
      name: postgres-backup
