apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: collab-app
  namespace: collab
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: collab-app
  minReplicas: 1
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 240
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15




