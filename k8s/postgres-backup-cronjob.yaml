apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: collab
  labels:
    app: postgresbackup
spec:
  schedule: "38 9 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 4
      template:
        metadata:
          labels:
            app: postgresbackup
        spec:
          containers:
            - name: postgresbackup
              image: ${IMG}
              imagePullPolicy: IfNotPresent
              # The app image runs as non-root (USER appuser), but this script
              # installs packages with `apk add` and writes /root/.s3cfg, so the
              # backup container must run as root.
              securityContext:
                runAsUser: 0
              command: ["/bin/sh"]
              args: ["/app/script/backup-postgres.sh"]
              env:
                - name: POSTGRES_DATABASE
                  value: collab_db
                - name: POSTGRES_HOST
                  value: collab-postgres
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: password
                - name: SHELL
                  value: /bin/sh
              volumeMounts:
                - name: s3cmd-config-volume
                  mountPath: "/etc/s3cmd"
                  readOnly: true
          volumes:
            - name: s3cmd-config-volume
              configMap:
                name: s3cmd-config
                items:
                  - key: s3cfg
                    path: s3cfg
          restartPolicy: OnFailure
