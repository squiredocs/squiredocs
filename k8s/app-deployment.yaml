apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-app
  namespace: collab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collab-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: collab-app
    spec:
      containers:
        - name: collab-app
          image: ${IMG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: collab-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: collab_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_REDIRECT_URI
            # JWT Secrets
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ACCESS_TOKEN_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: REFRESH_TOKEN_SECRET
            # Client URL (for CORS and redirects)
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: CLIENT_URL
            # MCP OAuth Secrets
            - name: MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_JWT_SECRET
            - name: MCP_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_REFRESH_SECRET
            - name: MCP_AUTH_CODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_AUTH_CODE_SECRET
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
      restartPolicy: Always
status: {}


