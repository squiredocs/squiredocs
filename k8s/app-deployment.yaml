apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-app
  namespace: collab
spec:
  replicas: 2
  selector:
    matchLabels:
      app: collab-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: collab-app
    spec:
      containers:
        - name: collab-app
          image: ${IMG}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3001
              protocol: TCP
          env:
            - name: PORT
              value: "3001"
            - name: DB_HOST
              value: collab-postgres
            - name: DB_PORT
              value: "5432"
            - name: DB_NAME
              value: collab_db
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: password
            # Google OAuth
            - name: GOOGLE_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_CLIENT_ID
            - name: GOOGLE_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_CLIENT_SECRET
            - name: GOOGLE_REDIRECT_URI
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_REDIRECT_URI
            # JWT Secrets
            - name: ACCESS_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ACCESS_TOKEN_SECRET
            - name: REFRESH_TOKEN_SECRET
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: REFRESH_TOKEN_SECRET
            # Client URL (for CORS and redirects)
            - name: CLIENT_URL
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: CLIENT_URL
            # MCP OAuth Secrets
            - name: MCP_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_JWT_SECRET
            - name: MCP_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_REFRESH_SECRET
            - name: MCP_AUTH_CODE_SECRET
              valueFrom:
                secretKeyRef:
                  name: mcp-auth-secret
                  key: MCP_AUTH_CODE_SECRET
            # AI Chat
            - name: GOOGLE_GENERATIVE_AI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: GOOGLE_GENERATIVE_AI_API_KEY
            # Shared Anthropic key — backs the default chat model (claude-opus,
            # DEFAULT_MODEL_KEY in server/api/chat-models.js) for non-BYOK users.
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: ANTHROPIC_API_KEY
            # AI_CHAT_MODEL is intentionally not injected here: the default chat
            # model is a version-controlled code constant (DEFAULT_MODEL_KEY in
            # server/api/chat-models.js). Set AI_CHAT_MODEL in the env only to
            # override that default for a specific deployment.
            - name: API_KEY_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: auth-secret
                  key: API_KEY_ENCRYPTION_KEY
            # Email Notifications (AWS SES SMTP)
            - name: SES_SMTP_USER
              valueFrom:
                secretKeyRef:
                  name: ses-secret
                  key: SES_SMTP_USER
            - name: SES_SMTP_PASS
              valueFrom:
                secretKeyRef:
                  name: ses-secret
                  key: SES_SMTP_PASS
            - name: SES_FROM_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ses-secret
                  key: SES_FROM_EMAIL
            - name: ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: ses-secret
                  key: ADMIN_EMAIL
            # S3-backed document image storage (optional: image uploads are
            # disabled if this secret is absent — see server/s3-images.js)
            - name: S3_IMAGE_BUCKET
              valueFrom:
                secretKeyRef:
                  name: s3-images-secret
                  key: S3_IMAGE_BUCKET
                  optional: true
            - name: S3_IMAGE_REGION
              valueFrom:
                secretKeyRef:
                  name: s3-images-secret
                  key: S3_IMAGE_REGION
                  optional: true
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: s3-images-secret
                  key: AWS_ACCESS_KEY_ID
                  optional: true
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: s3-images-secret
                  key: AWS_SECRET_ACCESS_KEY
                  optional: true
            # Redis
            - name: REDIS_HOST
              value: collab-redis
            - name: REDIS_PORT
              value: "6379"
          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
      restartPolicy: Always
status: {}


