apiVersion: v1
kind: Service
metadata:
  name: collab-loadbalancer
  namespace: collab
  annotations:
    # WebSocket connections upgrade from HTTP, so a single HTTP port handles both
spec:
  selector:
    app: collab-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 3001
  type: LoadBalancer
  # Session affinity helps maintain WebSocket connections to the same pod
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800  # 3 hours - typical WebSocket connection lifetime

