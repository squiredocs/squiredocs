apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-backup
  namespace: collab
  labels:
    app: postgresbackup
spec:
  schedule: "38 9 * * *"
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 4
      template:
        metadata:
          labels:
            app: postgresbackup
        spec:
          imagePullSecrets:
            - name: ecr-creds
          containers:
            - name: postgresbackup
              # Dedicated backup image (Dockerfile.backup): pg16-client + AWS CLI v2
              # baked in, non-root, no runtime install. Resolved by the Kustomize
              # `images:` override (aws-prod pins by digest).
              image: collab-backup
              imagePullPolicy: IfNotPresent
              command: ["/bin/bash"]
              args: ["/usr/local/bin/backup-postgres.sh"]
              env:
                - name: POSTGRES_DATABASE
                  value: collab_db
                - name: POSTGRES_HOST
                  value: collab-postgres
                - name: POSTGRES_USER
                  valueFrom:
                    secretKeyRef:
                      name: postgres-secret
                      key: username
                # Password is delivered as a MOUNTED FILE (never an env var or
                # argv). The script builds a PGPASSFILE from it (FR-023).
                - name: POSTGRES_PASSWORD_FILE
                  value: /secrets/pg/password
                - name: BACKUP_BUCKET
                  value: squiredocs-db-backups
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: backup-writer-creds
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: backup-writer-creds
                      key: AWS_SECRET_ACCESS_KEY
                - name: AWS_DEFAULT_REGION
                  value: us-east-1
              volumeMounts:
                - name: pg-password
                  mountPath: /secrets/pg
                  readOnly: true
          volumes:
            - name: pg-password
              secret:
                secretName: postgres-secret
                items:
                  - key: password
                    path: password
                    mode: 0400
          restartPolicy: OnFailure
