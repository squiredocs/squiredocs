apiVersion: apps/v1
kind: Deployment
metadata:
  name: collab-redis
  namespace: collab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: collab-redis
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: collab-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          args:
            - redis-server
            - --appendonly
            - "yes"
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          # Liveness uses a cheap non-forking TCP check and a generous
          # failure budget so transient CPU starvation on the local VM
          # can't kill a healthy redis (was a crash-loop source).
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          ports:
            - containerPort: 6379
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "128Mi"
            limits:
              memory: "256Mi"
          volumeMounts:
            - mountPath: /data
              name: redis-data
      restartPolicy: Always
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: redis-data
