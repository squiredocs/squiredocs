# Config for the collab-devcontainer CLI (sibling repo). Tracked here so any
# checkout of collab "just works" with `collab-devcontainer up`. See the
# collab-devcontainer repo's README for the full pattern.
schema_version = 1

[target]
name = "collab"
# Path the repo is synced/mounted to inside the sandbox pod. Matches the
# existing Minikube + Mutagen flow (docs/dev.md) so scripts and habits carry over.
workspace_mount = "/local-dev"

[minikube]
context = "minikube"
namespace = "collab"
deployment = "app-dev"            # same name collab's mutagen.sh / port-forward.sh target
postgres_service = "collab-postgres"
postgres_port = 5432
redis_service = "collab-redis"
redis_port = 6379

[image]
# Built into Minikube's Docker daemon by `collab-devcontainer build`.
name = "collab-dev:latest"

[mutagen]
# Reuse the sync name collab's script/mutagen.sh creates.
sync_name = "app-sync"

[mounts]
# Comma-separated host dirs bound into the pod (read-only) at the SAME absolute
# path, via `minikube mount` + hostPath — so a dragged file path (e.g. a
# screenshot) resolves inside the pod. Tilde-expanded. The macOS screenshot
# thumbnail temp dir is auto-added when present. Leave empty to disable.
host_paths = "~/Desktop,~/Downloads"

[git]
# Bind-mount the host repo's .git into the pod at <workspace_mount>/.git so
# in-pod git and gh operate on the real history. .git is excluded from the
# Mutagen sync (two-way syncing it is unsafe), so without this the pod has no
# git metadata. Read-write and 9p-backed like the screenshot mounts — commits
# made in the pod land in the host repo. Set false to disable.
mount_dotgit = true

[claude]
# Where Claude Code writes per-project sessions inside the pod (cwd=/local-dev,
# running as root). Derived automatically if omitted.
session_dir = "~/.claude/projects/-local-dev"
