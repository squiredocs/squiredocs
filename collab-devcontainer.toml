# Config for the collab-devcontainer CLI, which lives in-repo at devcontainer/.
# Tracked here so any checkout of collab "just works" with `collab-devcontainer
# up`. See devcontainer/README.md for the full pattern.
schema_version = 1

[target]
name = "collab"
# Path the repo is synced/mounted to inside the sandbox pod. Matches the
# existing Minikube + Mutagen flow (docs/dev.md) so scripts and habits carry over.
workspace_mount = "/local-dev"

[minikube]
context = "minikube"
namespace = "collab"
deployment = "app-dev"            # same name collab's mutagen.sh / port-forward.sh target
postgres_service = "collab-postgres"
postgres_port = 5432
redis_service = "collab-redis"
redis_port = 6379

[image]
# Built into Minikube's Docker daemon by `collab-devcontainer build`.
name = "collab-dev:latest"

[mutagen]
# Reuse the sync name collab's script/mutagen.sh creates.
sync_name = "app-sync"

[mounts]
# Comma-separated host dirs bound into the pod (read-only) at the SAME absolute
# path, via `minikube mount` + hostPath — so a dragged file path (e.g. a
# screenshot) resolves inside the pod. Tilde-expanded. Leave empty to disable.
#
# Auto-added on macOS, so they don't need listing here:
#   * the configured screenshot destination (com.apple.screencapture location),
#     when it's been changed from the default ~/Desktop;
#   * $TMPDIR/TemporaryItems — where a screenshot lives BEFORE it's saved, i.e.
#     what you get when you drag the floating thumbnail straight into the pod;
#   * /private/tmp, used by some apps to stage drag promises.
#
# These mounts are fragile by nature: `minikube mount` never reconnects, so a
# reboot or `minikube stop/start` leaves them dead. `collab-devcontainer mounts
# --install-agent` installs a LaunchAgent that re-establishes them automatically;
# `collab-devcontainer mounts` heals them on demand.
host_paths = "~/Desktop,~/Downloads"

# Same mechanism, but bound READ-WRITE — for host repos you want to edit from
# inside the pod, at the same absolute path. Edits land directly on the host
# tree (no Mutagen involved), so the pod can rewrite whatever is listed here:
# only add repos you'd let the sandbox modify. Requires `up`/`restart` to take
# effect — a running pod keeps whatever access its spec was created with.
#
# The CLI itself lives in-repo (devcontainer/) and rides the Mutagen sync, so
# it no longer needs an entry here.
rw_paths = ""

[git]
# Bind-mount the host repo's .git into the pod at <workspace_mount>/.git so
# in-pod git and gh operate on the real history. .git is excluded from the
# Mutagen sync (two-way syncing it is unsafe), so without this the pod has no
# git metadata. Read-write and 9p-backed like the screenshot mounts — commits
# made in the pod land in the host repo. Set false to disable.
mount_dotgit = true

[claude]
# Where Claude Code writes per-project sessions inside the pod (cwd=/local-dev,
# running as root). Derived automatically if omitted.
session_dir = "~/.claude/projects/-local-dev"
