<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-label="Architecture diagram: external systems are mirrored into a source store; an agent-managed claims store holds metadata; both connect through a central Entity anchor; a coding agent reads and writes the data layer.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/>
    </marker>
    <style>
      .lbl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .title { font-weight: 700; fill: #1f2937; }
      .sub { fill: #6b7280; }
      .edge { fill: #64748b; }
      .flow { stroke: #94a3b8; stroke-width: 1.5; fill: none; }
    </style>
  </defs>

  <rect width="760" height="430" fill="#ffffff"/>

  <!-- External systems -->
  <rect x="235" y="20" width="290" height="52" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="42" text-anchor="middle" class="lbl title" font-size="15">External systems</text>
  <text x="380" y="60" text-anchor="middle" class="lbl sub" font-size="12">Jira · GitHub · Linear · Zoom</text>

  <!-- mirror arrow -->
  <path d="M380 72 L380 108" class="flow" marker-end="url(#arrow)"/>
  <text x="392" y="94" class="lbl edge" font-size="12">mirror</text>

  <!-- Data layer container -->
  <rect x="55" y="112" width="650" height="228" rx="14" fill="#ffffff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="76" y="136" class="lbl title" font-size="13" fill="#7c3aed">Data layer</text>

  <!-- Source store -->
  <rect x="86" y="164" width="214" height="140" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="193" y="192" text-anchor="middle" class="lbl title" font-size="14">Source store</text>
  <text x="193" y="214" text-anchor="middle" class="lbl sub" font-size="11.5">Mirrors of external</text>
  <text x="193" y="230" text-anchor="middle" class="lbl sub" font-size="11.5">records</text>
  <text x="193" y="256" text-anchor="middle" class="lbl sub" font-size="11.5">Read locally, not</text>
  <text x="193" y="272" text-anchor="middle" class="lbl sub" font-size="11.5">through live APIs</text>

  <!-- Entity anchor -->
  <rect x="316" y="204" width="128" height="60" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="1.5"/>
  <text x="380" y="230" text-anchor="middle" class="lbl title" font-size="14">Entity</text>
  <text x="380" y="248" text-anchor="middle" class="lbl sub" font-size="11.5">stable anchor</text>

  <!-- Claims store -->
  <rect x="460" y="164" width="214" height="140" rx="10" fill="#f5f0ff" stroke="#ddd6fe"/>
  <text x="567" y="192" text-anchor="middle" class="lbl title" font-size="14">Claims store</text>
  <text x="567" y="214" text-anchor="middle" class="lbl sub" font-size="11.5">Agent-authored</text>
  <text x="567" y="230" text-anchor="middle" class="lbl sub" font-size="11.5">metadata</text>
  <text x="567" y="256" text-anchor="middle" class="lbl sub" font-size="11.5">Classifications,</text>
  <text x="567" y="272" text-anchor="middle" class="lbl sub" font-size="11.5">relations</text>

  <!-- connectors to entity -->
  <path d="M300 234 L316 234" class="flow"/>
  <path d="M444 234 L460 234" class="flow"/>

  <!-- reads & writes arrow to agent -->
  <path d="M380 340 L380 372" class="flow" marker-end="url(#arrow)"/>
  <text x="392" y="360" class="lbl edge" font-size="12">reads &amp; writes</text>

  <!-- Coding agent -->
  <rect x="298" y="376" width="164" height="44" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="380" y="403" text-anchor="middle" class="lbl title" font-size="14">Coding agent</text>
</svg>
